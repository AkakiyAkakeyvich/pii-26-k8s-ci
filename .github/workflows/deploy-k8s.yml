name: Build and Deploy to K8s

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          echo "Сборка Docker-образа..."
          docker build -t my-docker-app:latest .

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm Chart
        run: |
          echo "Проверка Helm-чарта..."
          helm lint .

      - name: Deploy to Kubernetes (Simulation)
        run: |
          echo "Настройка доступа к кластеру Kubernetes..."
          echo "Выполнение: helm upgrade --install my-release . --namespace default"
          echo "Имитация успешного развертывания в кластер!"
          echo "Приложение my-docker-app развернуто с помощью Helm."
